<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUNLI | Leaderboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container" style="max-width: 600px;">
        <header class="dashboard-header">
            <h1>🏆 TOP CSS</h1>
            <p>Ang mga Lodi ng ICT-CSS</p>
        </header>

        <div class="leaderboard-box">
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Section</th>
                        <th>Points</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-data">
                    </tbody>
            </table>
        </div>

        <button class="login-btn" style="margin-top: 20px; width: 200px;" onclick="location.href='dashboard.html'">Bumalik</button>
    </div>

    <script src="leaderboard.js"></script>
</body>
</html>
