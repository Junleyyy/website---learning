<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUNLI | My Stats</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container" style="max-width: 500px;">
        <header class="dashboard-header">
            <h1>📊 MY STATS</h1>
            <p id="stat-name">Loading Profile...</p>
        </header>

        <div class="stats-box" style="text-align: left; margin-top: 20px;">
            <div class="stat-item">
                <label>Overall Points</label>
                <h2 id="stat-points" style="color: #00f2fe; text-align: left; font-size: 2rem;">0</h2>
            </div>

            <div class="stat-item" style="margin-top: 20px;">
                <label>CSS Level Progress</label>
                <div class="progress-bar-bg" style="width: 100%; height: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 10px;">
                    <div id="progress-fill" style="width: 0%; height: 100%; background: linear-gradient(90deg, #4facfe, #00f2fe); border-radius: 10px; transition: 1s ease-in-out;"></div>
                </div>
                <p id="rank-text" style="font-size: 0.8rem; margin-top: 5px; opacity: 0.7;">Rank: CSS Novice</p>
            </div>

            <div class="info-list" style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
                <p style="color: white;">📧 <span id="stat-email">---</span></p>
                <p style="color: white; margin-top: 10px;">🏫 <span id="stat-section">---</span></p>
            </div>
        </div>

        <button class="login-btn" style="margin-top: 30px;" onclick="location.href='dashboard.html'">Back to Dashboard</button>
    </div>

    <script src="stats.js"></script>
</body>
</html>
